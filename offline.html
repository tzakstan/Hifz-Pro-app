<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musajjal Pro – Offline Mode</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f4ed;
      color: #1c1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      border: 1px solid #e7dfd3;
      box-shadow: 0 4px 18px rgba(107, 15, 36, 0.08);
      max-width: 400px;
      width: 100%;
    }
    .offline-icon { font-size: 48px; margin-bottom: 12px; }
    h2 { color: #6b0f24; margin-bottom: 8px; font-size: 20px; }
    p { font-size: 13px; color: #78716c; margin-bottom: 20px; line-height: 1.5; }
    .btn-return {
      background: #6b0f24;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📶</div>
    <h2>Offline Mode Active</h2>
    <p>
      You are currently offline in the classroom. Don't worry! Musajjal Pro is completely cached and your daily evaluations are saved safely in local storage.
    </p>
    <a href="./index.html" class="btn-return">Open Cached Records</a>
  </div>
</body>
</html>
